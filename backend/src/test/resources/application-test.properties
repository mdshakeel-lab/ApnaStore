# ==============================================================================
# Test Profile: In-Memory H2 Database
# Isolated testing environment: never touches ./data/ or persists to disk
# ==============================================================================

# In-Memory H2 Database (ephemeral, fast, isolated per test run)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 web console in test profile
spring.h2.console.enabled=false

# JWT Configuration for testing (safe dummy HMAC-SHA256 key >= 256 bits)
app.jwt.secret=apnastore-test-secret-key-do-not-use-in-production-min64chars!!
app.jwt.expiration-ms=86400000

# Admin Seed Account password
app.seed.admin-password=Admin@Store2026

