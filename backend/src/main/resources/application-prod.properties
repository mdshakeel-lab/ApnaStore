# ==============================================================================
# Production Profile: MySQL Database (Environment-Variable Driven)
# Zero Hardcoded Credentials - All Sensitive Values Sourced via ENV
# ==============================================================================

# Database Connection via Environment Variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/apnastore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:apna_admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production JPA / Hibernate Safety Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Disable H2 Console in Production for Security
spring.h2.console.enabled=false
