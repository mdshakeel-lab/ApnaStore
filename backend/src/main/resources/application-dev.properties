# ==============================================================================
# Development Profile: Embedded H2 Database (File Mode for Persistence)
# ==============================================================================

# H2 File-based Database (Survives server restarts)
spring.datasource.url=jdbc:h2:file:./data/apnastore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Interactive Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==============================================================================
# JWT Configuration
# IMPORTANT: Override app.jwt.secret via the APNASTORE_JWT_SECRET environment
# variable in any environment that handles real user data.
# This dev default MUST NOT be used in production.
# ==============================================================================
app.jwt.secret=${APNASTORE_JWT_SECRET:apnastore-dev-secret-key-do-not-use-in-production-min64chars!!}
app.jwt.expiration-ms=${APNASTORE_JWT_EXPIRY_MS:86400000}

# ==============================================================================
# Admin Seed Account (dev profile only)
# Override via ADMIN_SEED_PASSWORD environment variable.
# ==============================================================================
app.seed.admin-password=${ADMIN_SEED_PASSWORD:Admin@Store2026}

